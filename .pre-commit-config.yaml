repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix]
      - id: ruff-format
        name: ruff format
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.26
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: dprint-contree-sdk
        name: dprint
        entry: bash -lc 'dprint fmt --config dprint.json .'
        language: system
        files: (^|/)README\.md$
        pass_filenames: false
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: bash -lc 'exec uv run python scripts/ty_baseline.py check' --
        language: system
        pass_filenames: false
        files: (?x)^(.*\.py|\.ty/.*|(?:.*/)?pyproject\.toml)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/semgrep/pre-commit
    rev: 'v1.150.0'
    hooks:
      - id: semgrep

