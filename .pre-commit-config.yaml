repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: mixed-line-ending
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff
        name: ruff check
        args: [--fix]
      - id: ruff-format
        name: ruff format
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.26
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: dprint-contree-sdk
        name: dprint (contree-sdk)
        entry: bash -lc 'cd contree-sdk && dprint fmt --config dprint.json .'
        language: system
        files: ^contree-sdk/.*\.md$
        pass_filenames: false
  - repo: local
    hooks:
      - id: basedpyright-contree-sdk
        name: basedpyright (contree-sdk)
        entry: bash -lc 'cd contree-sdk && exec uv run --no-sync basedpyright --project pyproject.toml "${@/#contree-sdk\//}"' --
        language: system
        types_or: [python]
        files: ^contree-sdk/.*\.py$




