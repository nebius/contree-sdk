name: Publish to PyPI

on:
  push:
    branches:
      - main
      - fix/pre-release-fixes

permissions:
  contents: read
  id-token: write

jobs:
  check-required-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for required checks
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          check-name: checks-complete
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-conclusions: success
          running-workflow-name: 'Publish to PyPI'

      - name: Wait for tests
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          check-name: tests-complete
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-conclusions: success
          running-workflow-name: 'Publish to PyPI'

      - name: Wait for security
        uses: lewagon/wait-on-check-action@v1.5.0
        with:
          ref: ${{ github.sha }}
          check-name: security-complete
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allowed-conclusions: success
          running-workflow-name: 'Publish to PyPI'
  publish:
    needs: check-required-workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pipx install uv

      - name: Build
        run: uv build

      - name: Publish via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
