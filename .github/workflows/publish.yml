name: Publish to PyPI

on:
  push:
    branches:
      - main
      - fix/pre-release-fixes

permissions:
  contents: read
  id-token: write

jobs:
  check-required-workflows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - checks-complete
          - tests-complete
          - security-complete
          - pytest
    steps:
      - name: Wait for ${{ matrix.check }}
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: wait-for-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.check }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          timeoutSeconds: 3600
          intervalSeconds: 10

      - name: Verify ${{ matrix.check }} succeeded
        if: steps.wait-for-check.outputs.conclusion != 'success'
        run: |
          echo "❌ Check '${{ matrix.check }}' did not succeed"
          echo "Conclusion: ${{ steps.wait-for-check.outputs.conclusion }}"
          exit 1

      - name: ${{ matrix.check }} passed
        if: steps.wait-for-check.outputs.conclusion == 'success'
        run: echo "✅ Check '${{ matrix.check }}' passed successfully"
  publish:
    needs: check-required-workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pipx install uv

      - name: Build
        run: uv build

      - name: Publish via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
