name: SDK checks

on:
  pull_request:
  release:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - run: uv run --all-extras ruff check .

  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - run: uv run --all-extras ruff format --check .

  basedpyright:
    runs-on: ubuntu-latest
    needs: [ruff-check, ruff-format]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - run: uv run --all-extras basedpyright --project pyproject.toml

  dprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dprint/check@v2.3
        with:
          config-path: dprint.json

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md

  uv-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - run: uv lock --check

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            watched:
              - "contree_sdk/**/*.py"
              - "pyproject.toml"

      - name: Check version bump
        if: steps.changes.outputs.watched == 'true'
        run: |
          pip install packaging toml
          python -c "
          import toml, subprocess, sys
          from packaging.version import parse
          with open('pyproject.toml') as f: current = toml.load(f)['project']['version']
          base = '${{ github.event.pull_request.base.sha }}' or 'HEAD~1'
          old_content = subprocess.check_output(['git', 'show', f'{base}:pyproject.toml'], text=True)
          old_version = toml.loads(old_content)['project']['version']
          print(f'{old_version=}, {current=}')
          assert parse(current) > parse(old_version)
          "

  checks-complete:
    needs: [ruff-check, ruff-format, basedpyright, dprint, markdownlint, uv-lock, version-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check tests result
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        run: echo "✅ All tests passed"

      - name: Fail if any test failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "❌ Some tests failed, were cancelled, or were skipped"
          exit 1
