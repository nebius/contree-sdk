[project]
name = "contree-sdk"
version = "0.0.0.dev4"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "strenum",
    "cattrs",
    "httpx", # todo move to httpx when transport will be supported
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-xdist",
    "rich",
]
httpx = [

]
shell = [

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contree_sdk"]

[tool.hatch.build.targets.sdist]
only-include = ["contree_sdk", "pyproject.toml", "README.md"]

[tool.hatch.build]
only-packages = true
