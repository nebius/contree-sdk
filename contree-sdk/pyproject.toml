[project]
name = "contree-sdk"
version = "0.0.0.dev0"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "strenum",
    "cattrs",
    "httpx", # todo move to httpx when transport will be supported
    "aiofile",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-xdist",
]
httpx = [

]
shell = [

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contree_sdk"]
