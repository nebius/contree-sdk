[project]
name = "contree-sdk"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "pydantic>=2.11.1",
    "strenum"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio",
    "pytest-httpx",
]
httpx = [
    "httpx",
]
shell = [

]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contree_sdk"]
