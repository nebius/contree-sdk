'''

[[cases]]
name = "factory_requires_session_class_not_instance"
errors = [{ line = 2, code = "no-matching-overload" }]
code = '''
def use(session: CustomSync):
    create_sandbox_session(session_type=session)
'''

[[cases]]
name = "lazy_context_preserves_self"
code = '''
def sync_use(session: CustomLazy):
    with session as entered:
        assert_type(entered, CustomLazy)

async def async_use(session: CustomAsyncLazy):
    async with session as entered:
        assert_type(entered, CustomAsyncLazy)
'''

