imports = '''
from typing_extensions import assert_type
from contree_client.testing import ContreeClient, ContreeAsyncClient
from contree_sdk import sync_import_image, async_import_image, sync_build_image, async_build_image
from contree_sdk.cache import SyncMemoryCache, AsyncMemoryCache
from contree_sdk.store import SyncMemoryStore, AsyncMemoryStore
from contree_sdk.docker import ContreeDockerBuilder, ContreeAsyncDockerBuilder
'''

[[cases]]
name = "sync_helpers_return_image_uuid"
code = '''
client = ContreeClient()
assert_type(sync_import_image("alpine:latest", client=client, cache=SyncMemoryCache()), str)
assert_type(sync_build_image(".", client=client, storage=SyncMemoryStore(), cache=SyncMemoryCache()), str)
'''

[[cases]]
name = "async_helpers_return_image_uuid"
code = '''
async def use():
    client = ContreeAsyncClient()
    assert_type(await async_import_image("alpine:latest", client=client, cache=AsyncMemoryCache()), str)
    assert_type(await async_build_image(".", client=client, storage=AsyncMemoryStore(), cache=AsyncMemoryCache()), str)
'''

[[cases]]
name = "sync_import_rejects_wrong_client"
errors = [{ line = 1, code = "invalid-argument-type" }]
code = '''
sync_import_image(".", client=ContreeAsyncClient())
'''

