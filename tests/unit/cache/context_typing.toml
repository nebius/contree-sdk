imports = '''
from typing_extensions import assert_type
from contree_sdk.cache import (
    SyncCache, AsyncCache, SyncMemoryCache, AsyncMemoryCache, SyncSQLiteCache, AsyncSQLiteCache,
)
'''

[[cases]]
name = "sync_cache_context_preserves_self"
code = '''
class CustomCache(SyncMemoryCache):
    pass

def use(base: SyncCache, memory: SyncMemoryCache, sqlite: SyncSQLiteCache, custom: CustomCache):
    with base as entered:
        assert_type(entered, SyncCache)
    with memory as entered_memory:
        assert_type(entered_memory, SyncMemoryCache)
    with sqlite as entered_sqlite:
        assert_type(entered_sqlite, SyncSQLiteCache)
    with custom as entered_custom:
        assert_type(entered_custom, CustomCache)
'''

[[cases]]
name = "async_cache_context_preserves_self"
code = '''
class CustomCache(AsyncMemoryCache):
    pass

async def use(base: AsyncCache, memory: AsyncMemoryCache, sqlite: AsyncSQLiteCache, custom: CustomCache):
    async with base as entered:
        assert_type(entered, AsyncCache)
    async with memory as entered_memory:
        assert_type(entered_memory, AsyncMemoryCache)
    async with sqlite as entered_sqlite:
        assert_type(entered_sqlite, AsyncSQLiteCache)
    async with custom as entered_custom:
        assert_type(entered_custom, CustomCache)
'''
