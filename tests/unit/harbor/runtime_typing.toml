imports = '''
from typing_extensions import assert_type
from contree_sdk import ContreeSession, ContreeAsyncSession
from contree_sdk.harbor.runtime import (
    AsyncRuntime, ContreeAsyncRuntime, RuntimeOptions, create_runtime,
)
'''

[[cases]]
name = "runtime_context_preserves_self"
code = '''
class CustomRuntime(ContreeAsyncRuntime):
    pass

async def use(base: AsyncRuntime, concrete: ContreeAsyncRuntime, custom: CustomRuntime):
    async with base as entered:
        assert_type(entered, AsyncRuntime)
    async with concrete as entered_concrete:
        assert_type(entered_concrete, ContreeAsyncRuntime)
    async with custom as entered_custom:
        assert_type(entered_custom, CustomRuntime)
'''

[[cases]]
name = "runtime_factory_accepts_class_and_function"
code = '''
def factory(session: ContreeAsyncSession, *, options: RuntimeOptions | None = None) -> ContreeAsyncRuntime:
    return ContreeAsyncRuntime(session, options=options)

def use(session: ContreeAsyncSession):
    assert_type(create_runtime(session), AsyncRuntime)
    assert_type(create_runtime(session, factory=ContreeAsyncRuntime), AsyncRuntime)
    assert_type(create_runtime(session, factory=factory), AsyncRuntime)
'''

[[cases]]
name = "runtime_factory_requires_options_keyword"
errors = [{ line = 5, code = "invalid-argument-type" }]
code = '''
def factory(session: ContreeAsyncSession) -> ContreeAsyncRuntime:
    return ContreeAsyncRuntime(session)

def use(session: ContreeAsyncSession):
    create_runtime(session, factory=factory)
'''

[[cases]]
name = "runtime_factory_rejects_coroutine_result"
errors = [{ line = 5, code = "invalid-argument-type" }]
code = '''
async def factory(session: ContreeAsyncSession, *, options: RuntimeOptions | None = None) -> ContreeAsyncRuntime:
    return ContreeAsyncRuntime(session, options=options)

def use(session: ContreeAsyncSession):
    create_runtime(session, factory=factory)
'''

[[cases]]
name = "runtime_factory_rejects_unrelated_result"
errors = [{ line = 5, code = "invalid-argument-type" }]
code = '''
def factory(session: ContreeAsyncSession, *, options: RuntimeOptions | None = None) -> str:
    return "runtime"

def use(session: ContreeAsyncSession):
    create_runtime(session, factory=factory)
'''

[[cases]]
name = "runtime_rejects_sync_session"
errors = [{ line = 2, code = "invalid-argument-type" }]
code = '''
def use(session: ContreeSession):
    create_runtime(session)
'''
