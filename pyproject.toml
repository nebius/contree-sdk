[project]
name = "contree-examples"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "contree-sdk[dev]",
]


[project.optional-dependencies]
docs = [
    "contree-docs",
]
dev = [
    "ruff",
    "contree-sdk[dev]",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "docs",
    "contree-sdk"
]

[tool.uv.sources]
contree-docs = { workspace = true }
contree-sdk = { workspace = true }


[[tool.uv.index]]
name = "nebius"
url = "https://artifactory.nebius.dev/artifactory/api/pypi/ai-rnd/simple"
publish-url = "https://artifactory.nebius.dev/artifactory/api/pypi/ai-rnd"
explicit = true

[tool.ruff]
line-length = 120
src = ["contree_sdk"]

target-version = "py310"

exclude = [
    ".git",
    ".venv",
    "venv",
]

[tool.ruff.lint]
extend-safe-fixes = [
    "C408", # unnecessary-collection-call
    "RUF022", # unsorted-dunder-all
    "SIM101", # duplicate-isinstance-call
    "SIM108", # if-else-block-instead-of-if-exp
    "UP006", # non-pep585-annotation
    "UP007", # non-pep604-annotation-union
    "UP035", # deprecated-import
    "UP038", # non-pep604-isinstance
]
extend-unsafe-fixes = [
    "PGH003",
    "RUF100",
    "RUF102",
]

select = [
    "A",   # flake8-builtins
    "AIR", # Airflow
    "ASYNC", # flake8-async
    "B",   # flake8-bugbear
    "C",   # flake8-comprehensions
    "COM", # flake8-commas
    "E",     # pycodestyle Error
    "ERA", # eradicate
    "EXE",   # flake8-executable
    "F",     # Pyflakes
    "FA",    # flake8-future-annotations
    "I",     # isort
    "PGH", # pygrep-hooks
    "PIE", # flake8-pie
    "PL",  # Pylint
    "PYI", # flake8-pyi
    "RET", # flake8-return
    "RSE",   # flake8-raise
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "SLOT",  # flake8-slots
    "T",   # flake8-debugger
    "TID",   # flake8-tidy-imports
    "TRY", # tryceratops
    "UP",  # pyupgrade
    "W",     # pycodestyle Warning
    "YTT",   # flake8-2020
]

extend-ignore = [
    "ANN002",   # missing-type-args
    "ANN003",   # missing-type-kwargs
    "ANN202",   # missing-return-type-private-function
    "ANN204",   # missing-return-type-special-method
    "ANN401",   # any-type
    "COM812", # missing-trailing-comma
    "E203",   # whitespace-before-punctuation
    "E741",   # ambiguous-variable-name
    "PIE790", # unnecessary-placeholder
    "RUF012", # mutable-class-default
    "RUF013", # implicit-optional
    "S311",   # suspicious-non-cryptographic-random-usage
    "TRY003", # raise-vanilla-args
    "T201",   # print
    "RUF059", # unused-unpacked-variable
    "ASYNC230", # blocking-open-call-in-async-function
]

[tool.ruff.lint.per-file-ignores]
"*" = [
    "COM812",   # missing-trailing-comma
    "N813",     # camelcase-imported-as-lowercase
    "PLC0415",  # import-outside-top-level
    "PLR2004",  # ideally, magic-value-comparison
    "PLW1510",  # unspecified-encoding
    "PLW2901",  # redefined-loop-name
    "PTH118",   # os-path-join
    "RUF005",   # collection-literal-concatenation
    "RUF012",   # mutable-class-default,  because of old pydantic, ideally to turn on
    "TC",       # typing-only-*-import
    "TRY003",   # ideally, raise-vanilla-args
]


[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = ["contree_sdk"]
known-third-party = []

combine-as-imports = false
force-sort-within-sections = false
lines-after-imports = 2
split-on-trailing-comma = false
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
]

[tool.ruff.lint.pylint]
max-args = 12
