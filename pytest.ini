[pytest]
testpaths =
    tests
    examples
    README.md
    docs
markers =
    e2e: tests that go to real endpoints
    markdown: examples inside md files
addopts =
    -m 'not e2e' -s --import-mode=importlib
    -p no:recording
;    -n auto

asyncio_mode = auto

log_cli = true
log_cli_level = DEBUG
